name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, echo]
    paths:
      - 'SynthAIPro/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SynthAIPro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SynthAIPro/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Echo-debug-apk
          path: SynthAIPro/android/app/build/outputs/apk/debug/app-debug.apk
